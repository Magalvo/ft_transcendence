<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input, button { display: block; margin: 10px 0; padding: 8px; width: 250px; }
  </style>
</head>
<body>
  <h2>Reset Password</h2>
  <input id="newPassword" type="password" placeholder="Enter new password" required>
  <button onclick="resetPassword()">Change Password</button>

  <script>
    async function resetPassword() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      const newPassword = document.getElementById("newPassword").value.trim();

      if (!token || !newPassword) return alert("Missing token or password");

      const res = await fetch("/api/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, newPassword })
      });

      const data = await res.json();
      if (res.ok) {
        alert("✅ Password reset successful! You can now log in.");
        window.location.href = "/";
      } else {
        alert("Error: " + data.error);
      }
    }
  </script>
</body>
</html>
