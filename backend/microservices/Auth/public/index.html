<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FT Transcendence Auth</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    input, button { display: block; margin: 5px 0; padding: 8px; width: 250px; }
    img { max-width: 200px; margin-top: 10px; }
    .section { margin-bottom: 30px; }
    .hidden { display: none; }
    #forgotContainer { margin-top: 10px; }
  </style>
</head>
<body>

<h1>FT Transcendence Auth</h1>

<!-- REGISTER SECTION -->
<div class="section" id="registerSection">
  <h2>Register</h2>
  <input id="regUser" placeholder="Username" required>
  <input id="regPass" type="password" placeholder="Password" required>
  <input id="regEmail" type="email" placeholder="Email" required>
  <button type="button" id="registerBtn">Register</button>
</div>

<!-- LOGIN SECTION -->
<div class="section" id="loginSection">
  <h2>Login</h2>
  <input id="logUser" placeholder="Username" required>
  <input id="logPass" type="password" placeholder="Password" required>
  <input id="log2fa" placeholder="2FA Code" class="hidden">
  <button type="button" id="loginBtn">Login</button>

  <button id="googleLoginBtn" style="background:#4285F4; color:white; border:none; padding:8px; width:250px; cursor:pointer;">
    Login with Google
  </button>

  <div id="forgotContainer">
    <button type="button" id="toggleForgotBtn">Forgot my password</button>
    <div id="forgotForm" class="hidden">
      <input id="forgotEmail" type="email" placeholder="Enter your email">
      <button type="button" id="forgotBtn">Send Reset Link</button>
    </div>
  </div>
</div>

<!-- 2FA SETUP SECTION -->
<div class="section hidden" id="twoFASection">
  <h2>Enable 2FA</h2>
  <button id="setup2FABtn">Generate 2FA QR Code</button>
  <div id="qr-container" class="hidden">
    <p>Scan this QR code in your authenticator app:</p>
    <img id="qr" alt="2FA QR Code">
    <input id="reg2fa" placeholder="Enter 6-digit 2FA code">
    <button type="button" id="verify2FABtn">Verify 2FA</button>
  </div>
</div>

<!-- RESET PASSWORD SECTION -->
<div class="section hidden" id="resetSection">
  <h2>Reset Password</h2>
  <input id="newPassword" type="password" placeholder="New Password">
  <input id="confirmPassword" type="password" placeholder="Confirm New Password">
  <button type="button" id="resetBtn">Change Password</button>
</div>

<script>
let jwtToken = null;

// Load JWT from localStorage
function loadToken() {
  const stored = localStorage.getItem("jwtToken");
  if (stored) jwtToken = stored;
}

// Helper for authenticated requests
function authHeaders() {
  const token = jwtToken || localStorage.getItem("jwtToken");
  if (!token) {
    alert("You must log in first!");
    throw new Error("User not authenticated");
  }
  return {
    "Authorization": "Bearer " + token,
    "Content-Type": "application/json"
  };
}


// Initialize
window.addEventListener("DOMContentLoaded", () => {
  const params = new URLSearchParams(window.location.search);
  const resetToken = params.get("token");
  const googleToken = params.get("token");

  if (resetToken) {
    document.getElementById("registerSection").classList.add("hidden");
    document.getElementById("loginSection").classList.add("hidden");
    document.getElementById("twoFASection").classList.add("hidden");
    document.getElementById("resetSection").classList.remove("hidden");
    window.resetToken = resetToken;
  }

  if (googleToken) {
    jwtToken = googleToken;
    localStorage.setItem("jwtToken", jwtToken);
    alert("Logged in with Google!");
    document.getElementById("registerSection").classList.add("hidden");
    document.getElementById("loginSection").classList.add("hidden");
    document.getElementById("resetSection").classList.add("hidden");
    document.getElementById("twoFASection").classList.remove("hidden");
    window.history.replaceState({}, document.title, window.location.pathname);
  }

  loadToken();
});

// REGISTER
document.getElementById("registerBtn").addEventListener("click", async () => {
  const username = document.getElementById("regUser").value.trim();
  const password = document.getElementById("regPass").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  if (!username || !password || !email) return alert("Please fill in all fields.");

  try {
    const res = await fetch("/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, email })
    });
    const data = await res.json();
    if (!res.ok) return alert(data.error || "Error registering");

    jwtToken = data.token;
    localStorage.setItem("jwtToken", jwtToken);
    alert("Registered successfully! You can now enable 2FA.");
    document.getElementById("twoFASection").classList.remove("hidden");
  } catch (err) {
    console.error(err);
    alert("Registration failed.");
  }
});

// LOGIN
document.getElementById("loginBtn").addEventListener("click", async () => {
  const username = document.getElementById("logUser").value.trim();
  const password = document.getElementById("logPass").value.trim();
  const code = document.getElementById("log2fa").value.trim();
  if (!username || !password) return alert("Please enter username and password.");

  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password, twoFactorCode: code })
    });
    const data = await res.json();
    if (!res.ok) return alert("Error: " + data.error);

    jwtToken = data.token;
    localStorage.setItem("jwtToken", jwtToken);
    localStorage.setItem("refreshToken", data.refreshToken);
    alert("Login successful!");
  } catch (err) {
    console.error(err);
    alert("Login failed.");
  }
});

// 2FA Setup
document.getElementById("setup2FABtn").addEventListener("click", async () => {
  if (!jwtToken) return alert("You must log in before setting up 2FA.");

  try {
   const res = await fetch("/api/2fa/setup", {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify({}) // important! cannot be empty
    });

    const data = await res.json();
    if (!res.ok) return alert(data.error || "Failed to generate QR code");

    const qrImg = document.getElementById("qr");
    qrImg.src = data.qr;
    document.getElementById("qr-container").classList.remove("hidden");
  } catch (err) {
    console.error(err);
    alert("2FA setup failed: " + err.message);
  }
});

// 2FA Verify
document.getElementById("verify2FABtn").addEventListener("click", async () => {
  const code = document.getElementById("reg2fa").value.trim();
  if (!code) return alert("Enter the 6-digit code from your authenticator app.");

  try {
    const res = await fetch("/api/2fa/verify", {
      method: "POST",
      headers: authHeaders(),
      body: JSON.stringify({ code })
    });
    const data = await res.json();
    if (!res.ok) return alert(data.error || "Error verifying 2FA");

    alert("2FA setup complete!");
    document.getElementById("qr-container").classList.add("hidden");
  } catch (err) {
    alert(err.message);
    console.error(err);
  }
});

// RESET PASSWORD
document.getElementById("resetBtn").addEventListener("click", async () => {
  const newPassword = document.getElementById("newPassword").value.trim();
  const confirmPassword = document.getElementById("confirmPassword").value.trim();
  if (!newPassword || !confirmPassword) return alert("Please fill in both fields.");
  if (newPassword !== confirmPassword) return alert("Passwords do not match.");

  try {
    const res = await fetch("/api/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: window.resetToken, newPassword })
    });
    const data = await res.json();
    if (res.ok) {
      alert("Password reset successful! You can now log in.");
      window.location.href = "/";
    } else {
      alert("Error: " + data.error);
    }
  } catch (err) {
    console.error(err);
    alert("Password reset failed.");
  }
});

// GOOGLE LOGIN
document.getElementById("googleLoginBtn").addEventListener("click", () => {
  window.location.href = "/api/auth/google/login";
});

// TOGGLE FORGOT PASSWORD FORM
document.getElementById("toggleForgotBtn").addEventListener("click", () => {
  document.getElementById("forgotForm").classList.toggle("hidden");
});

// SEND FORGOT PASSWORD LINK
document.getElementById("forgotBtn").addEventListener("click", async () => {
  const email = document.getElementById("forgotEmail").value.trim();
  if (!email) return alert("Enter your email.");

  try {
    const res = await fetch("/api/forgot", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    alert(data.message || "Check your email for reset instructions.");
  } catch (err) {
    console.error(err);
    alert("Failed to send reset email.");
  }
});
</script>

</body>
</html>
