<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Pong Lobby Test</title>
        <style>
        body { font-family: sans-serif; background: #222; color: #fff; padding: 20px; }
        .panel { background: #333; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        h2 { margin-top: 0; color: #4CAF50; }
        button {
            padding: 10px 15px; margin: 5px; cursor: pointer;
            background: #555; color: white; border: none; border-radius: 4px;
            font-size: 14px;
        }
        button:hover { background: #777; }
        button.action { background: #2196F3; }
        button.start { background: #f44336; font-weight: bold; }
        #logs { 
            background: #000; color: #0f0; padding: 10px; 
            height: 200px; overflow-y: scroll; font-family: monospace; 
        }
    </style>
    </head>
    <body>

        <h1>🏓 Game Lobby Tester</h1>

        <div class="panel">
            <h2>1. Settings</h2>
            <p>Duration:</p>
            <button onclick="emit('setDuration', 'fast')">Fast</button>
            <button onclick="emit('setDuration', 'normal')">Normal</button>
            <button onclick="emit('setDuration', 'long')">Long</button>

            <p>Type:</p>
            <button onclick="emit('setType', 'one_for_one')">1 vs 1</button>
            <button onclick="emit('setType', 'two_for_two')">2 vs 2</button>
            <button onclick="emit('setType', 'three_for_three')">3 vs 3</button>

            <p>Extras:</p>
            <button onclick="emit('togglePowerUps')">Toggle PowerUps</button>
            
            <p>Ready:</p>
            <button class="action" onclick="emit('forceReady', 0)">Force P1
                Ready</button>
            <button class="action" onclick="emit('forceReady', 1)">Force P2
                Ready</button>
        </div>

        <div class="panel">
            <h2>2. Players</h2>
            <div style="display:flex; gap: 20px;">
                <div>
                    <h3>LEFT Team</h3>
                    <button class="action"
                        onclick="emit('joinGame', {side: 'left'})">Join as
                        Human</button>
                    <button class="action"
                        onclick="emit('addBot', {side: 'left', level: 5})">Add
                        Bot (Lvl 5)</button>
                </div>
                <div>
                    <h3>RIGHT Team</h3>
                    <button class="action"
                        onclick="emit('joinGame', {side: 'right'})">Join as
                        Human</button>
                    <button class="action"
                        onclick="emit('addBot', {side: 'right', level: 5})">Add
                        Bot (Lvl 5)</button>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>3. Action</h2>
            <button class="start" onclick="emit('startGame')">🚀 START GAME
                INSTANCE</button>
        </div>

        <div class="panel">
            <h2>Server Logs</h2>
            <div id="logs"></div>
        </div>

        <script src="/socket.io/socket.io.js"></script>
        <script>
        const socket = io();
        const logsDiv = document.getElementById('logs');

        // Função genérica para enviar eventos
        function emit(event, data) {
            socket.emit(event, data);
        }

        // Receber logs do servidor e mostrar na tela
        socket.on('log', (message) => {
            const p = document.createElement('div');
            p.textContent = `> ${message}`;
            logsDiv.appendChild(p);
            logsDiv.scrollTop = logsDiv.scrollHeight;
        });

        // Receber mensagens de jogo (ex: countdown)
        socket.on('gameMessage', (data) => {
            console.log("GAME MSG:", data);
        });

        socket.on('gameState', (data) => {
            // Apenas para debug na consola do browser, para veres se o snapshot chega
            // console.log("State:", data);
        });
    </script>
    </body>
</html>
