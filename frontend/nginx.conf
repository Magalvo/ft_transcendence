map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    # Avatar uploads are capped at 10 MB by the Auth service.
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://gateway:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (not append) so clients cannot spoof their address.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /avatars/ {
        proxy_pass http://gateway:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (not append) so clients cannot spoof their address.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /socket.io/ {
        proxy_pass http://auth:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (not append) so clients cannot spoof their address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400;
    }

    location /spacedout-ws {
        proxy_pass http://spacedout:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Overwrite (not append) so clients cannot spoof their address.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
