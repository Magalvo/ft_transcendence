name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auth:
    name: Auth service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/Auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/Auth/package-lock.json
      - run: npm ci --no-audit --progress=false
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Test
        run: npm test

  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/Gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/Gateway/package-lock.json
      - run: npm ci --no-audit --progress=false
      - name: Typecheck and build
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Same flags as frontend/Dockerfile.
      - run: npm ci --legacy-peer-deps --no-audit --progress=false
      - name: Test
        run: npm test
      - name: Typecheck and build
        run: npm run build

  spacedout-server:
    name: SpacedOut server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SpacedOut/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No npm ci: the tested modules are pure and have no dependencies.
      # Installing would build uWebSockets.js and the native combat addon.
      - name: Test
        run: npm test
