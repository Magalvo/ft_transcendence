services:
  gateway:
    container_name: ApiGateWay
    build:
      context: ./backend/Gateway
      dockerfile: Dockerfile
    environment:
      - AUTH_UPSTREAM=http://auth:3000
    expose:
      - "3333"
    networks:
      - transcendencenet
    restart: on-failure
    depends_on:
      - auth

  auth:
    container_name: Auth
    build:
      context: ./backend/Auth
      dockerfile: Dockerfile
    env_file:
      - ./backend/Auth/.env
    environment:
      - AVATARS_PATH=/usr/src/auth/public/avatars
      - DB_FILE=/usr/src/auth/data/dev.sqlite
      - FRONTEND_URL=https://localhost:8443
      - SPACEDOUT_WS_URL=/spacedout-ws
    expose:
      - "3000"
    volumes:
      - auth_avatars:/usr/src/auth/public/avatars
      - auth_database:/usr/src/auth/data
    networks:
      - transcendencenet
    restart: on-failure

  frontend:
    container_name: Frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
      - "8443:443"
    networks:
      - transcendencenet
    restart: on-failure
    depends_on:
      - gateway
      - auth
      - spacedout

  spacedout:
    container_name: SpacedOut
    build:
      context: ./SpacedOut/backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/Auth/.env
    expose:
      - "3000"
    networks:
      - transcendencenet
    restart: on-failure

volumes:
  auth_avatars:
  auth_database:

networks:
  transcendencenet:
    driver: bridge
