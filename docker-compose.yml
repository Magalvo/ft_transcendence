services:
  gateway:
    container_name: ApiGateWay
    build:
      context: ./backend/Gateway
      dockerfile: Dockerfile
    environment:
      - AUTH_UPSTREAM=http://auth:3000
    ports:
      - "3333:3333"
    networks:
      - transcendencenet
    restart: on-failure
    depends_on:
      - auth
  auth:
      container_name: Auth
      build:
        context: ./backend/Auth
        dockerfile: Dockerfile
      ports:
        - "3000:3000"
      env_file:
        - ./backend/Auth/.env
      environment:
        - AVATARS_PATH=/Auth/public/avatars
        - DB_FILE=/Auth/data/dev.sqlite
      volumes:
        - auth_avatars:/Auth/public/avatars
        - auth_database:/Auth/data
      networks:
        - transcendencenet
      restart: on-failure
  frontend:
      container_name: Frontend
      build:
        context: ./frontend
        dockerfile: Dockerfile
      ports:
        - "5173:5173"
      networks:
        - transcendencenet
      restart: on-failure
      depends_on:
        - gateway

volumes:
  auth_avatars:
  auth_database:

networks:
  transcendencenet:
    driver: bridge
