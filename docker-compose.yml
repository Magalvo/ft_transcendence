services:
  gateway:
    container_name: ApiGateWay
    build:
      context: ./backend/Gateway
      dockerfile: Dockerfile
    environment:
      - AUTH_UPSTREAM=http://auth:3000
    expose:
      - "3333"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3333/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - transcendencenet
    restart: on-failure
    depends_on:
      auth:
        condition: service_healthy

  auth:
    container_name: Auth
    build:
      context: ./backend/Auth
      dockerfile: Dockerfile
    env_file:
      - ./backend/Auth/.env
    environment:
      - AVATARS_PATH=/usr/src/auth/public/avatars
      - DB_FILE=/usr/src/auth/data/dev.sqlite
      - FRONTEND_URL=https://localhost:8443
      - PORT=3000
      - SPACEDOUT_WS_URL=/spacedout-ws
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - GOOGLE_CLIENT_SECRET_FILE=/run/secrets/google_client_secret
    secrets:
      - jwt_secret
      - google_client_secret
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - auth_avatars:/usr/src/auth/public/avatars
      - auth_database:/usr/src/auth/data
    networks:
      - transcendencenet
    restart: on-failure
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    container_name: Mailpit
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - transcendencenet
    restart: unless-stopped

  frontend:
    container_name: Frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
      - "8443:443"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1 || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - transcendencenet
    restart: on-failure
    depends_on:
      gateway:
        condition: service_healthy
      auth:
        condition: service_healthy
      spacedout:
        condition: service_healthy

  spacedout:
    container_name: SpacedOut
    build:
      context: ./SpacedOut/backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/Auth/.env
    environment:
      - PORT=3000
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const net=require('net');const socket=net.connect(3000,'127.0.0.1',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000);
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - transcendencenet
    restart: on-failure

volumes:
  auth_avatars:
  auth_database:

networks:
  transcendencenet:
    driver: bridge

secrets:
  jwt_secret:
    file: ./.secrets/jwt_secret.txt
  google_client_secret:
    file: ./.secrets/google_client_secret.txt
