services: 
  gateway:
    container_name: ApiGateWay
    build:
      context: ./backend/Gateway  
      dockerfile: Dockerfile
    ports: 
      - "3333:3333"
    networks:
      - transcendencenet
    restart: on-failure
    depends_on:
      - auth
  auth:
      container_name: Auth
      build:
        context: ./backend/Auth
        dockerfile: Dockerfile
      ports:
        - "3000:3000"
      environment:
        - JWT_SECRET=${JWT_SECRET}
      networks:
        - transcendencenet
      restart: on-failure
  frontend:
     container_name: Frontend
     build:
       context: ./frontend
       dockerfile: Dockerfile
     ports:
       - "5173:5173"
     networks:
       - transcendencenet
     restart: on-failure

networks:
  transcendencenet:
    driver: bridge
