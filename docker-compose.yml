services:
  gateway:
    container_name: ApiGateWay
    build:
      context: ./backend/Gateway
      dockerfile: Dockerfile
    environment:
      - AUTH_UPSTREAM=http://auth:3000
    ports:
      - "3333:3333"
    networks:
      - transcendencenet
    restart: on-failure
    depends_on:
      - auth
  auth:
      container_name: Auth
      build:
        context: ./backend/Auth
        dockerfile: Dockerfile
      ports:
        - "3000:3000"
      env_file:
        - ./backend/Auth/.env
      environment:
        - AVATARS_PATH=/usr/src/auth/public/avatars
        - DB_FILE=/usr/src/auth/data/dev.sqlite
        - SPACEDOUT_WS_URL=ws://localhost:3030
      volumes:
        - auth_avatars:/usr/src/auth/public/avatars
        - auth_database:/usr/src/auth/data
      networks:
        - transcendencenet
      restart: on-failure
  frontend:
      container_name: Frontend
      build:
        context: ./frontend
        dockerfile: Dockerfile
      environment:
        - VITE_API_URL=http://localhost:3333
        - VITE_WS_URL=http://localhost:3000
        - VITE_SPACEDOUT_WS_URL=ws://localhost:3030
      ports:
        - "5173:5173"
      networks:
        - transcendencenet
      restart: on-failure
      depends_on:
        - gateway
        - spacedout

  spacedout:
      container_name: SpacedOut
      build:
        context: ./SpacedOut/backend
        dockerfile: Dockerfile
      env_file:
        - ./backend/Auth/.env
      ports:
        - "3030:3000"
      networks:
        - transcendencenet
      restart: on-failure

volumes:
  auth_avatars:
  auth_database:

networks:
  transcendencenet:
    driver: bridge
